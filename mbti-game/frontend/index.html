<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#07060b">
<title>차원문 너머 — MBTI 분기 게임</title>
<meta name="description" content="여덟 번의 선택으로 MBTI를 알아보는 이세계 판타지 텍스트 게임">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Gowun+Dodum&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<!-- 배경: 2겹 크로스페이드. 실제 이미지 도입 전까지 CSS 절차적 생성 -->
<div class="bg-layer" id="bg-a"></div>
<div class="bg-layer" id="bg-b"></div>
<div class="bg-grain"></div>
<!-- 등장인물 입상 — 배경 위, 가독성 베일 아래 -->
<div class="stage" id="stage" aria-hidden="true"></div>

<div class="bg-veil"></div>
<div class="bg-vignette"></div>

<div class="shell">
  <header class="hud hidden" id="hud">
    <div class="hud-left">
      <span class="hud-mark">◈</span>
      <span class="hud-chapter" id="chapter"></span>
    </div>
    <div class="hud-right">
      <div class="dots" id="dots" role="progressbar" aria-label="진행도" aria-valuemin="0"></div>
      <button class="icon-btn" id="backlog-btn" aria-label="지난 기록 보기" title="지난 기록 (Esc로 닫기)">기록</button>
    </div>
  </header>

  <main class="log" id="log" aria-live="polite"></main>

  <div class="controls" id="controls"></div>
</div>

<!-- 장면 전환 암전 -->
<div class="curtain" id="curtain"></div>

<!-- 판정 연출 -->
<div class="judging" id="judging" hidden>
  <div class="sigil"><span>◈</span></div>
  <p>차원문이 당신을 읽고 있습니다</p>
</div>

<!-- 백로그 -->
<div class="backlog" id="backlog" hidden>
  <div class="backlog-panel">
    <header>
      <h2>지난 기록</h2>
      <button class="icon-btn" data-close aria-label="닫기">닫기</button>
    </header>
    <div class="backlog-body" id="backlog-body"></div>
  </div>
</div>

<script type="module" src="js/app.js"></script>
</body>
</html>
